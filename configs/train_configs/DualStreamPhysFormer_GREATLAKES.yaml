# Example configuration file for Dual-Stream PhysFormer
# This configuration demonstrates how to set up the dual-stream model

BASE: []
# Toolbox mode
TOOLBOX_MODE: 'train_and_test'

# Training configuration
TRAIN:
  EPOCHS: 10
  BATCH_SIZE: 1
  LR: 1e-4
  MODEL_FILE_NAME: DualStreamPhysFormer
  PLOT_LOSSES_AND_LR: True
  
  # Data configuration
  DATA:
    FS: 30  # Frame rate
    DATASET: iPadData  
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/nfs/turbo/coe-mni/iPadData/train"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/nfs/turbo/coe-mni/iPadData_train_preprocess_128x128"   # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.1
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: False
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128

VALID:
  DATA:
    FS: 30
    DATASET: iPadData
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/nfs/turbo/coe-mni/iPadData/valid"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/nfs/turbo/coe-mni/iPadData_valid_preprocess_128x128"   # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.1
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: False
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128

TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA', 'PERCENT_ACCURACY']
  USE_LAST_EPOCH: False
  DATA:
    FS: 30
    DATASET: iPadData
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/nfs/turbo/coe-mni/iPadData/test"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/nfs/turbo/coe-mni/iPadData_test_preprocess_128x128"   # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.1
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: False
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128

DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: 'runs/exp/DualStreamPhysFormer'

# Model configuration
MODEL:
  NAME: DualStreamPhysFormer
  MODEL_DIR: runs/exp/DualStreamPhysFormer
  DROP_RATE: 0.1
  # Dual-Stream PhysFormer specific parameters
  DUALSTREAMPHYSFORMER:
    PATCH_SIZE: 4
    DIM: 96
    FF_DIM: 144
    NUM_HEADS: 4
    NUM_LAYERS: 12
    THETA: 0.7
    # Custom stem channel configurations (optional)
    RGB_STEM_CHANNELS: [24, 48, 96]    # RGB stem: [24, 48, 96] channels
    DEPTH_STEM_CHANNELS: [12, 24, 48]  # Depth stem: [12, 24, 48] channels

INFERENCE:
  BATCH_SIZE: 1
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 30        # In seconds
  MODEL_PATH:   ""